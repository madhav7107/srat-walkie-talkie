<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1329">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KWT - Kotecha Family Walkie-Talkie</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BACKGROUND KEEP-ALIVE AUDIO -->
  <audio id="silentAudio" loop playsinline src="silent.wav" preload="auto"></audio>

  <!-- ============================================================ -->
  <!-- SCREEN 1: FAMILY LOGIN / MEMBER SELECTION                    -->
  <!-- ============================================================ -->
  <div class="login-wrapper" id="loginScreen">
    <div class="login-card">
      <div class="login-brand">
        <img src="icon-192.png" alt="KWT Logo" class="brand-logo-img">
        <div class="brand-headings">
          <h1 class="brand-title">KWT</h1>
          <p class="brand-sub">કોટેચા પરિવાર વોકી-ટોકી</p>
          <span class="family-tag">Kotecha Family Connect</span>
        </div>
      </div>

      <div class="login-divider"></div>

      <!-- Step 1: Member Selection -->
      <div class="form-section">
        <label class="form-label">૧. તમારું નામ પસંદ કરો:</label>
        <div class="member-grid" id="memberGrid">
          <button type="button" class="member-card active" data-id="mem_1" data-name="Mansukhbhai">
            <span class="member-icon">👨‍🦳</span>
            <span class="member-name">Mansukhbhai</span>
            <span class="member-sub">વડીલ</span>
          </button>
          <button type="button" class="member-card" data-id="mem_2" data-name="Sudhaben">
            <span class="member-icon">👵</span>
            <span class="member-name">Sudhaben</span>
            <span class="member-sub">વડીલ</span>
          </button>
          <button type="button" class="member-card" data-id="mem_3" data-name="Nimeeshbhai">
            <span class="member-icon">👨</span>
            <span class="member-name">Nimeeshbhai</span>
            <span class="member-sub">પરિવાર</span>
          </button>
          <button type="button" class="member-card" data-id="mem_4" data-name="Umangben">
            <span class="member-icon">👩</span>
            <span class="member-name">Umangben</span>
            <span class="member-sub">પરિવાર</span>
          </button>
          <button type="button" class="member-card" data-id="mem_5" data-name="Kalpeshbhai">
            <span class="member-icon">👨</span>
            <span class="member-name">Kalpeshbhai</span>
            <span class="member-sub">પરિવાર</span>
          </button>
          <button type="button" class="member-card" data-id="mem_6" data-name="Kajalben">
            <span class="member-icon">👩</span>
            <span class="member-name">Kajalben</span>
            <span class="member-sub">પરિવાર</span>
          </button>
          <button type="button" class="member-card" data-id="mem_7" data-name="Madhav">
            <span class="member-icon">👦</span>
            <span class="member-name">Madhav</span>
            <span class="member-sub">પરિવાર</span>
          </button>
        </div>
      </div>

      <!-- Step 2: Family PIN -->
      <div class="form-section">
        <label class="form-label" for="loginPinInput">૨. ફેમિલી PIN નાખો:</label>
        <div class="pin-input-wrap">
          <input type="password" id="loginPinInput" class="input-field" value="6880" placeholder="PIN નાખો (6880)" inputmode="numeric" maxlength="6">
          <span class="pin-hint">Default: 6880</span>
        </div>
      </div>

      <!-- Error Message -->
      <div class="login-error-msg" id="loginError" style="display: none;"></div>

      <!-- Submit Button -->
      <button type="button" class="btn-login-submit" id="btnEnterRadio">
        <span>પરિવાર સાથે જોડાઓ</span>
        <span class="arrow-icon">➔</span>
      </button>

      <div class="login-footer">
        🔒 સુરક્ષિત ખાનગી ફેમિલી ચેનલ
      </div>
    </div>
  </div>


  <!-- ============================================================ -->
  <!-- SCREEN 2: ACTIVE FAMILY WALKIE-TALKIE RADIO SCREEN           -->
  <!-- ============================================================ -->
  <div class="radio-wrapper" id="radioScreen" style="display: none;">
    <div class="radio-chassis">
      
      <!-- Top Status Header -->
      <div class="radio-top-bar">
        <div class="radio-brand-badge">
          <img src="icon-192.png" alt="KWT Logo" class="radio-header-logo">
          <span class="radio-brand-text">KWT</span>
        </div>
        <div class="online-counter" id="onlineCounterBadge">
          <span class="counter-dot" id="networkLed"></span>
          <span id="counterText">1 / 7 હાજર</span>
        </div>
        <button type="button" class="btn-switch-user" id="btnSwitchUser" title="નામ બદલો">
          બદલો 🔄
        </button>
      </div>

      <!-- Active User Profile Bar -->
      <div class="active-user-bar">
        <span class="user-label">તમારું નામ:</span>
        <span class="user-name-tag" id="currentUserNameTag">👦 Madhav</span>
      </div>

      <!-- Master Super Admin Control (Only for Madhav) -->
      <div class="master-control-bar" id="masterControlBar" style="display: none;">
        <div class="master-title-row">
          <span class="master-badge">👑 સુપર એડમિન કંટ્રોલ</span>
          <span class="master-user-tag">માધવ સ્પેશિયલ એક્સેસ</span>
        </div>
        <button type="button" class="btn-master-toggle line-active" id="btnMasterToggle">
          <span class="toggle-icon" id="masterToggleIcon">🟢</span>
          <span class="toggle-text" id="masterToggleText">લાઈન ચાલુ છે (બંધ કરવા દબાવો)</span>
        </button>
      </div>

      <!-- Family Members Status Roster -->
      <div class="family-roster-box">
        <div class="roster-header">પરિવારના સભ્યો:</div>
        <div class="roster-grid" id="rosterGrid">
          <!-- Dynamically filled with members -->
        </div>
      </div>

      <!-- Center LCD Screen -->
      <div class="lcd-screen" id="lcdScreen">
        <div class="lcd-header">
          <span class="lcd-freq">CHANNEL: FAMILY MAIN</span>
          <span class="lcd-vol" id="lcdVolIndicator">VOL: 100%</span>
        </div>

        <div class="lcd-main-status" id="lcdMainStatus">
          🟢 લાઇન તૈયાર છે (શાંત છે)
        </div>

        <div class="lcd-sub-status" id="lcdSubStatus">
          વાત કરવા માટે નીચેનું બટન દબાવી રાખો
        </div>

        <!-- Audio Waveform Visualizer -->
        <div class="audio-wave-bars" id="audioWaveBars">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
      </div>

      <!-- Quick Family Bell Controls -->
      <div class="family-bells-row">
        <button type="button" class="btn-bell btn-chai" id="btnChaiBell">
          <span class="bell-icon">☕</span>
          <span class="bell-text">ચા / જમવાની બેલ</span>
        </button>
        <button type="button" class="btn-bell btn-urgent" id="btnUrgentAlert">
          <span class="bell-icon">🚨</span>
          <span class="bell-text">ઇમરજન્સી એલર્ટ</span>
        </button>
      </div>

      <!-- Master PTT Button Area -->
      <div class="ptt-area">
        <button type="button" class="btn-ptt-giant" id="btnPttGiant">
          <div class="ptt-inner-circle">
            <span class="ptt-mic-icon">🎙️</span>
            <span class="ptt-main-label" id="pttMainLabel">દબાવી રાખો</span>
            <span class="ptt-sub-label" id="pttSubLabel">અને બોલો</span>
          </div>
          <div class="ptt-pulse-ring" id="pttPulseRing"></div>
        </button>
      </div>

      <!-- Bottom Audio Bar -->
      <div class="bottom-tools-bar">
        <button type="button" class="btn-tool" id="btnMuteToggle">
          <span id="muteIcon">🔊</span>
        </button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1">
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
